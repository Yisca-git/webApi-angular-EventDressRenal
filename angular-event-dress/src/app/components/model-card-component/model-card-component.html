<p-card class="model-card">
  <ng-template pTemplate="header">
    <img [src]="model.imgUrl" 
         [alt]="model.name" 
         class="card-image">
  </ng-template>
  
  <div class="card-content">
    <h3 class="model-name">{{ model.name }}</h3>
    <div class="price-section">
      <span class="price">${{ model.basePrice }}</span>
    </div>
  </div>
</p-card>
